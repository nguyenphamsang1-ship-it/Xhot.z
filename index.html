<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Xhot.com – Watch Movies Online with English Subtitles</title>
<meta name="description" content="Watch new movies, TV series and movies by genre in FHD quality with English subtitles.">
<style>
  :root {
    --bg: #000;
    --surface: #131316;
    --line: #26262b;
    --text: #fff;
    --muted: #9a9aa5;
    --accent: #ff4655;
    --gold: #f5b73b;
    --blue: #3b9cf5;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ul { list-style: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent); }

  .main-nav { display: flex; align-items: center; gap: 4px; }

  .nav-link {
    padding: 8px 14px;
    border-radius: 8px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    transition: color 0.2s, background 0.2s;
  }
  .nav-link:hover { color: var(--text); background: var(--surface); }
  .nav-link.active { color: var(--text); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }

  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 200px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    display: none;
    columns: 1;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .dropdown-menu button:hover,
  .dropdown-menu button.active { background: #1f1f25; color: var(--text); }
  .dropdown-empty { padding: 8px 12px; color: var(--muted); font-size: 0.9rem; }

  .search-form { margin-left: auto; position: relative; flex: 0 1 340px; min-width: 200px; }
  .search-form input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .search-form input::placeholder { color: var(--muted); }
  .search-form input:focus { outline: none; border-color: var(--accent); background: #1a1a1f; }
  .search-form svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
  }

  /* ---------- Main ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .section-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .section-title small { color: var(--muted); font-weight: 500; font-size: 0.9rem; margin-left: 8px; }

  #movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 22px 16px;
  }

  .empty-state {
    grid-column: 1 / -1;
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }

  /* ---------- Movie card ---------- */
  .movie-card { display: block; }

  .poster {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius);
    overflow: hidden;
    background: linear-gradient(160deg, #23232b, #101014);
    border: 1px solid var(--line);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease, filter 0.3s ease;
  }

  .poster .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    color: var(--muted);
    font-weight: 700;
    font-size: 1rem;
  }

  .poster::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent 55%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .play {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .play svg { width: 22px; height: 22px; margin-left: 3px; fill: #fff; }

  .badges {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 3;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.5;
    color: #000;
  }
  .badge.quality { background: var(--gold); }
  .badge.sub { background: var(--blue); color: #fff; }

  .movie-title {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 0.2s;
  }
  .movie-meta { margin-top: 2px; font-size: 0.8rem; color: var(--muted); }

  .movie-card:hover .poster,
  .movie-card:focus-visible .poster {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 14px 30px rgba(255, 70, 85, 0.22);
  }
  .movie-card:hover .poster img,
  .movie-card:focus-visible .poster img { transform: scale(1.08); filter: brightness(0.8); }
  .movie-card:hover .poster::after,
  .movie-card:focus-visible .poster::after { opacity: 1; }
  .movie-card:hover .play,
  .movie-card:focus-visible .play { opacity: 1; transform: scale(1); }
  .movie-card:hover .movie-title,
  .movie-card:focus-visible .movie-title { color: var(--accent); }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    padding: 24px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 760px) {
    .header-inner { gap: 10px 16px; padding: 10px 14px; }
    .search-form { order: 2; flex: 1 1 100%; margin-left: 0; }
    .logo { font-size: 1.3rem; }
    .main-nav { margin-left: auto; overflow-x: auto; max-width: 100%; }
    .dropdown-menu { position: fixed; left: 14px; right: 14px; top: auto; min-width: 0; margin-top: 8px; }
    main { padding: 20px 14px 48px; }
    #movie-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 18px 12px; }
    .section-title { font-size: 1.2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="./" class="logo" id="site-logo" aria-label="Xhot.com home">Xhot<span>.com</span></a>

    <nav class="main-nav" aria-label="Main menu">
      <button class="nav-link" data-filter="new" type="button">New Movies</button>
      <button class="nav-link" data-filter="series" type="button">TV Series</button>
      <div class="dropdown" id="genre-dropdown">
        <button class="nav-link" id="genre-toggle" type="button" aria-haspopup="true" aria-expanded="false">Genres ▾</button>
        <div class="dropdown-menu" id="genre-menu" role="menu"></div>
      </div>
    </nav>

    <form class="search-form" id="search-form" role="search" onsubmit="return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search-input" placeholder="Search movies..." aria-label="Search movies" autocomplete="off">
    </form>
  </div>
</header>

<main>
  <h1 class="section-title" id="section-title">All Movies</h1>
  <div id="movie-grid"></div>
</main>

<footer>© 2026 Xhot.com. All content belongs to its respective owners.</footer>

<!-- Movie data -->
<script src="movies.js"></script>

<script>
(function () {
  "use strict";

  /*
    Each movie in movies.js is an object, for example:
    {
      title: "Movie title",
      poster: "https://.../poster.jpg",
      link: "movies/movie-title.html",
      quality: "FHD",          // optional, defaults to "FHD"
      sub: "Eng Sub",          // optional, defaults to "Eng Sub"
      type: "series" | "movie",// "bo" and "le" also work (old values)
      genres: ["Action"],      // list of genres
      year: 2026,
      isNew: true              // shows up under "New Movies"
    }
  */
  var MOVIES = (typeof movies !== "undefined" && Array.isArray(movies)) ? movies : [];

  var grid = document.getElementById("movie-grid");
  var titleEl = document.getElementById("section-title");
  var searchInput = document.getElementById("search-input");
  var navLinks = document.querySelectorAll(".nav-link[data-filter]");
  var genreDropdown = document.getElementById("genre-dropdown");
  var genreToggle = document.getElementById("genre-toggle");
  var genreMenu = document.getElementById("genre-menu");

  var state = { mode: "all", genre: "", query: "" };

  function isSeries(m) { return m.type === "series" || m.type === "bo"; }
  function isMovie(m) { return m.type === "movie" || m.type === "le"; }

  function normalize(s) {
    return String(s || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "D")
      .toLowerCase()
      .trim();
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createCard(m) {
    var card = el("a", "movie-card");
    card.href = m.link || "#";
    card.title = m.title || "";

    var poster = el("div", "poster");

    var fallback = el("div", "fallback", m.title || "Untitled");
    poster.appendChild(fallback);

    if (m.poster) {
      var img = document.createElement("img");
      img.src = m.poster;
      img.alt = "Poster of " + (m.title || "");
      img.loading = "lazy";
      img.addEventListener("load", function () { fallback.style.display = "none"; });
      img.addEventListener("error", function () { img.remove(); });
      poster.appendChild(img);
    }

    var play = el("div", "play");
    play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';
    poster.appendChild(play);

    var badges = el("div", "badges");
    badges.appendChild(el("span", "badge quality", m.quality || "FHD"));
    badges.appendChild(el("span", "badge sub", m.sub || "Eng Sub"));
    poster.appendChild(badges);

    card.appendChild(poster);
    card.appendChild(el("h3", "movie-title", m.title || "Untitled"));

    var meta = [];
    if (m.year) meta.push(m.year);
    if (isSeries(m)) meta.push("TV Series");
    if (isMovie(m)) meta.push("Movie");
    if (meta.length) card.appendChild(el("p", "movie-meta", meta.join(" • ")));

    return card;
  }

  function getFiltered() {
    var q = normalize(state.query);
    return MOVIES.filter(function (m) {
      if (state.mode === "new" && !m.isNew) return false;
      if (state.mode === "series" && !isSeries(m)) return false;
      if (state.mode === "genre") {
        var gs = (m.genres || []).map(normalize);
        if (gs.indexOf(normalize(state.genre)) === -1) return false;
      }
      if (q && normalize(m.title).indexOf(q) === -1) return false;
      return true;
    });
  }

  function currentTitle() {
    if (state.query.trim()) return "Results for “" + state.query.trim() + "”";
    if (state.mode === "new") return "New Movies";
    if (state.mode === "series") return "TV Series";
    if (state.mode === "genre") return "Genre: " + state.genre;
    return "All Movies";
  }

  function render() {
    var list = getFiltered();
    grid.innerHTML = "";
    titleEl.textContent = currentTitle();

    var count = el("small", "", list.length + (list.length === 1 ? " movie" : " movies"));
    titleEl.appendChild(count);

    if (!list.length) {
      var msg = MOVIES.length
        ? "No movies found. Try a different keyword."
        : "No movie data yet. Add movies to movies.js.";
      grid.appendChild(el("div", "empty-state", msg));
      return;
    }

    var frag = document.createDocumentFragment();
    list.forEach(function (m) { frag.appendChild(createCard(m)); });
    grid.appendChild(frag);
  }

  function updateActive() {
    navLinks.forEach(function (b) {
      b.classList.toggle("active", state.mode === b.dataset.filter);
    });
    genreToggle.classList.toggle("active", state.mode === "genre");
    genreMenu.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", state.mode === "genre" && b.dataset.genre === state.genre);
    });
  }

  function buildGenreMenu() {
    var seen = {};
    var genres = [];
    MOVIES.forEach(function (m) {
      (m.genres || []).forEach(function (g) {
        var key = normalize(g);
        if (!seen[key]) { seen[key] = true; genres.push(g); }
      });
    });
    genres.sort(function (a, b) { return a.localeCompare(b, "en"); });

    genreMenu.innerHTML = "";
    if (!genres.length) {
      genreMenu.appendChild(el("div", "dropdown-empty", "No genres yet"));
      return;
    }
    genres.forEach(function (g) {
      var b = el("button", "", g);
      b.type = "button";
      b.dataset.genre = g;
      b.setAttribute("role", "menuitem");
      b.addEventListener("click", function () {
        state.mode = "genre";
        state.genre = g;
        closeDropdown();
        updateActive();
        render();
      });
      genreMenu.appendChild(b);
    });
  }

  function closeDropdown() {
    genreDropdown.classList.remove("open");
    genreToggle.setAttribute("aria-expanded", "false");
  }

  navLinks.forEach(function (b) {
    b.addEventListener("click", function () {
      state.mode = b.dataset.filter;
      state.genre = "";
      closeDropdown();
      updateActive();
      render();
    });
  });

  genreToggle.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = genreDropdown.classList.toggle("open");
    genreToggle.setAttribute("aria-expanded", open ? "true" : "false");
  });

  document.addEventListener("click", function (e) {
    if (!genreDropdown.contains(e.target)) closeDropdown();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDropdown();
  });

  searchInput.addEventListener("input", function () {
    state.query = searchInput.value;
    render();
  });

  document.getElementById("site-logo").addEventListener("click", function (e) {
    e.preventDefault();
    state = { mode: "all", genre: "", query: "" };
    searchInput.value = "";
    updateActive();
    render();
  });

  buildGenreMenu();
  updateActive();
  render();
})();
</script>
</body>
</html>
